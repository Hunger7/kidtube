<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shelf</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141821">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#141821; --raised:#1B2028; --hairline:#2B3240;
  --paper:#ECE7DE; --muted:#8C93A1; --brass:#C08A3E; --warn:#B4573F; --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--paper)}
body{
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header{position:sticky;top:0;z-index:20;background:var(--ground);padding:18px 18px 0}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--raised)}
.iconbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 18px;margin:0 -18px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;
  border-radius:999px;background:var(--raised);border:1px solid var(--hairline);
  font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip.text-only{padding:7px 16px}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.chip[aria-pressed="true"]{color:var(--ground);background:var(--paper);border-color:var(--paper)}

main{padding:0 18px 40px}
.card{display:block;width:100%;text-align:left;padding:0;margin:0 0 26px}
.thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--raised)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(10,12,16,.85);
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:5px}
.card h2{margin:11px 0 3px;font-size:16px;font-weight:600;line-height:1.32;letter-spacing:-.01em}
.meta{margin:0;font-size:13px;color:var(--muted)}

/* ---------- sealed player ---------- */
#player-view{position:fixed;inset:0;z-index:60;background:var(--ground);display:none;flex-direction:column}
#player-view.on{display:flex}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:0 0 auto}
.stage iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
/* Nothing reaches YouTube's own UI: every tap lands here instead. */
#shield{position:absolute;inset:0;z-index:2;background:transparent}
#tapcue{
  position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;
  opacity:0;transition:opacity .18s;
}
#tapcue.show{opacity:1}
#tapcue div{
  width:74px;height:74px;border-radius:50%;background:rgba(10,12,16,.6);
  display:grid;place-items:center;
}
#tapcue svg{width:32px;height:32px;fill:var(--paper)}

.nowplaying{flex:1 1 auto;overflow-y:auto;padding:16px 18px}
.nowplaying h2{margin:0 0 4px;font-size:18px;font-weight:600;line-height:1.3}

.controls{flex:0 0 auto;border-top:1px solid var(--hairline);background:var(--ground);
  padding:12px 18px calc(14px + env(safe-area-inset-bottom))}
.seekrow{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:40px}
.t.right{text-align:right}
input[type=range]{
  flex:1 1 auto;min-width:0;-webkit-appearance:none;appearance:none;height:26px;background:none;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--hairline)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:var(--paper);margin-top:-7px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--hairline)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border:0;border-radius:50%;background:var(--paper)}
.btnrow{display:flex;align-items:center;gap:10px}
.pbtn{flex:1 1 auto;height:56px;border-radius:var(--r);background:var(--raised);
  border:1px solid var(--hairline);display:grid;place-items:center}
.pbtn:active{background:var(--hairline)}
.pbtn.main{flex:1.5 1 auto;background:var(--paper);border-color:var(--paper);color:var(--ground)}
.pbtn svg{width:26px;height:26px;fill:currentColor}
.pbtn.wordy{font-size:15px;font-weight:600;color:var(--paper);background:none}

/* ---------- states ---------- */
.state{padding:70px 4px;text-align:center;color:var(--muted)}
.state h2{color:var(--paper);font-size:19px;margin:0 0 8px;font-weight:600}
.state p{margin:0 auto;font-size:14px;max-width:36ch}
.state code{font-size:13px;color:var(--brass)}
.skel{background:var(--raised);border-radius:var(--r);margin-bottom:26px}
.skel.th{aspect-ratio:16/9}
.skel.l{height:15px;width:82%;margin:11px 0 7px}
.skel.s{height:12px;width:45%}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div><h1>Shelf</h1><p class="sub" id="sub">Loading</p></div>
    <button class="iconbtn" id="refresh" aria-label="Refresh videos">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.6 3M20 4v7h-7"/></svg>
    </button>
  </div>
  <div class="rail" id="rail"></div>
</header>

<main id="feed"></main>

<div id="player-view">
  <div class="stage">
    <div id="yt"></div>
    <div id="shield" role="button" aria-label="Pause or resume"></div>
    <div id="tapcue"><div id="tapcue-inner"></div></div>
  </div>
  <div class="nowplaying"><h2 id="np-title"></h2><p class="meta" id="np-meta"></p></div>
  <div class="controls">
    <div class="seekrow">
      <span class="t" id="t-now">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position in video">
      <span class="t right" id="t-dur">0:00</span>
    </div>
    <div class="btnrow">
      <button class="pbtn" id="back10" aria-label="Back 10 seconds">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16" font-size="7" font-family="Archivo,sans-serif" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg>
      </button>
      <button class="pbtn main" id="playpause" aria-label="Pause"><svg viewBox="0 0 24 24" id="pp-icon"><path d="M7 4h4v16H7zm6 0h4v16h-4z"/></svg></button>
      <button class="pbtn" id="fwd10" aria-label="Forward 10 seconds">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16" font-size="7" font-family="Archivo,sans-serif" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg>
      </button>
      <button class="pbtn wordy" id="close-player">Done</button>
    </div>
  </div>
</div>

<script>
/* ================= config: read-only, from the repo ================= */
let cfg = null;
async function loadConfig(){
  const r = await fetch("config.json?v=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("config.json is missing or unreadable (" + r.status + ")");
  const c = await r.json();
  if (!c.apiKey || c.apiKey === "PASTE_YOUR_KEY_HERE") throw new Error("config.json has no API key yet.");
  if (!Array.isArray(c.channels) || !c.channels.length) throw new Error("config.json has no channels yet.");
  return Object.assign({hideShorts:true, maxPerChannel:12}, c);
}

const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }
};

let videos = [], filter = "all";

/* ================= api ================= */
const API = "https://www.googleapis.com/youtube/v3/";
async function yt(path, params){
  const q = new URLSearchParams(Object.assign({key:cfg.apiKey}, params));
  const r = await fetch(API + path + "?" + q);
  const j = await r.json();
  if (!r.ok) throw new Error(j?.error?.message || "Request failed (" + r.status + ")");
  return j;
}

async function fetchFeed(){
  const per = Math.max(1, Math.min(30, cfg.maxPerChannel));
  const batches = await Promise.all(cfg.channels.map(async ch => {
    try {
      const r = await yt("playlistItems", {part:"snippet,contentDetails", playlistId:ch.uploads, maxResults:per});
      return (r.items||[]).map(it => ({
        vid: it.contentDetails.videoId,
        title: it.snippet.title,
        channelId: ch.id, channelTitle: ch.title,
        published: it.contentDetails.videoPublishedAt || it.snippet.publishedAt,
        thumb: (it.snippet.thumbnails.medium || it.snippet.thumbnails.default || {}).url || "",
        seconds: null
      }));
    } catch(e){ return []; }
  }));
  let all = batches.flat().filter(v => v.vid);
  all.sort((a,b) => new Date(b.published) - new Date(a.published));
  all = all.slice(0, 90);
  await addDurations(all);
  if (cfg.hideShorts) all = all.filter(v => v.seconds === null || v.seconds > 65);
  return all;
}

async function addDurations(list){
  for (let i = 0; i < list.length; i += 50){
    const slice = list.slice(i, i+50);
    try {
      const r = await yt("videos", {part:"contentDetails", id:slice.map(v=>v.vid).join(",")});
      const map = {};
      (r.items||[]).forEach(it => map[it.id] = iso8601(it.contentDetails.duration));
      slice.forEach(v => { if (map[v.vid] != null) v.seconds = map[v.vid]; });
    } catch(e){}
  }
}
function iso8601(d){
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d || "");
  return m ? (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0) : null;
}

/* ================= formatting ================= */
function clock(s){
  if (s == null || isNaN(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
           : `${m}:${String(sec).padStart(2,"0")}`;
}
function ago(iso){
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 3600) return Math.max(1, Math.floor(d/60)) + " min ago";
  if (d < 86400) return Math.floor(d/3600) + " hr ago";
  if (d < 2592000){ const n = Math.floor(d/86400); return n + (n===1?" day ago":" days ago"); }
  if (d < 31536000){ const n = Math.floor(d/2592000); return n + (n===1?" month ago":" months ago"); }
  const n = Math.floor(d/31536000); return n + (n===1?" year ago":" years ago");
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const feedEl = $("feed"), railEl = $("rail"), subEl = $("sub");

/* ================= render ================= */
function renderRail(){
  if (!cfg || !cfg.channels.length){ railEl.innerHTML = ""; return; }
  const chip = (id,label,thumb) =>
    `<button class="chip${thumb?"":" text-only"}" data-ch="${esc(id)}" aria-pressed="${filter===id}">` +
    (thumb ? `<img src="${esc(thumb)}" alt="">` : "") + esc(label) + `</button>`;
  railEl.innerHTML = chip("all","Everything","") + cfg.channels.map(c => chip(c.id,c.title,c.thumb)).join("");
  railEl.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => {
    filter = b.dataset.ch; renderRail(); renderFeed();
  });
}

function renderFeed(){
  const list = filter === "all" ? videos : videos.filter(v => v.channelId === filter);
  if (!list.length){
    feedEl.innerHTML = `<div class="state"><h2>No videos here</h2>
      <p>Nothing recent from this channel, or the list hasn't refreshed yet.</p></div>`;
    return;
  }
  feedEl.innerHTML = list.map((v,i) => `
    <button class="card" data-i="${i}">
      <div class="thumb"><img src="${esc(v.thumb)}" alt="" loading="lazy">
        ${v.seconds ? `<span class="dur">${clock(v.seconds)}</span>` : ""}</div>
      <h2>${esc(v.title)}</h2>
      <p class="meta">${esc(v.channelTitle)} · ${ago(v.published)}</p>
    </button>`).join("");
  feedEl.querySelectorAll(".card").forEach(b => b.onclick = () => play(list[+b.dataset.i]));
}
function skeleton(){
  feedEl.innerHTML = Array(4).fill(`<div><div class="skel th"></div><div class="skel l"></div><div class="skel s"></div></div>`).join("");
}
function fatal(msg){
  feedEl.innerHTML = `<div class="state"><h2>Can't load the shelf</h2><p>${esc(msg)}</p></div>`;
  subEl.textContent = "Not ready";
}

/* ================= player ================= */
let player = null, apiReady = false, pending = null, ticker = null, dragging = false;
const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<path d="M7 4h4v16H7zm6 0h4v16h-4z"/>';

window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending){ const v = pending; pending = null; play(v); } };
(function(){ const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

function pushOverlay(){ if (!(history.state && history.state.overlay)) history.pushState({overlay:true}, ""); }
function popOverlay(fromBack){ if (!fromBack && history.state && history.state.overlay) history.back(); }

function play(v){
  $("np-title").textContent = v.title;
  $("np-meta").textContent = v.channelTitle + " · " + ago(v.published);
  $("t-now").textContent = "0:00";
  $("t-dur").textContent = clock(v.seconds);
  $("seek").value = 0;
  $("player-view").classList.add("on");
  document.body.style.overflow = "hidden";
  pushOverlay();
  if (!apiReady){ pending = v; return; }
  if (player && player.loadVideoById) player.loadVideoById(v.vid);
  else player = new YT.Player("yt", {
    videoId: v.vid,
    host: "https://www.youtube.com",
    playerVars: {
      controls:0, disablekb:1, fs:0, rel:0, iv_load_policy:3,
      modestbranding:1, playsinline:1, autoplay:1
    },
    events: {
      onReady: () => startTicker(),
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) closePlayer(false);
        setPP(e.data === YT.PlayerState.PLAYING);
        if (e.data === YT.PlayerState.PLAYING) startTicker();
      }
    }
  });
  startTicker();
}

function setPP(playing){
  $("pp-icon").innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
  $("playpause").setAttribute("aria-label", playing ? "Pause" : "Play");
}

function startTicker(){
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!player || !player.getDuration || dragging) return;
    const d = player.getDuration(), t = player.getCurrentTime();
    if (!d) return;
    $("t-dur").textContent = clock(d);
    $("t-now").textContent = clock(t);
    $("seek").value = Math.round(t / d * 1000);
  }, 500);
}

function toggle(){
  if (!player || !player.getPlayerState) return;
  const playing = player.getPlayerState() === YT.PlayerState.PLAYING;
  if (playing) player.pauseVideo(); else player.playVideo();
  cue(playing ? PAUSE_ICON : PLAY_ICON);
}
function cue(icon){
  $("tapcue-inner").innerHTML = `<svg viewBox="0 0 24 24">${icon}</svg>`;
  const c = $("tapcue");
  c.classList.add("show");
  clearTimeout(cue._t);
  cue._t = setTimeout(() => c.classList.remove("show"), 420);
}

$("shield").onclick = toggle;
$("playpause").onclick = toggle;
$("back10").onclick = () => { if (player) player.seekTo(Math.max(0, player.getCurrentTime() - 10), true); };
$("fwd10").onclick = () => { if (player) player.seekTo(player.getCurrentTime() + 10, true); };

const seek = $("seek");
["pointerdown","touchstart"].forEach(ev => seek.addEventListener(ev, () => dragging = true));
seek.addEventListener("input", () => {
  if (!player || !player.getDuration) return;
  $("t-now").textContent = clock(seek.value / 1000 * player.getDuration());
});
["pointerup","touchend","change"].forEach(ev => seek.addEventListener(ev, () => {
  if (player && player.getDuration) player.seekTo(seek.value / 1000 * player.getDuration(), true);
  dragging = false;
}));

function closePlayer(fromBack){
  clearInterval(ticker);
  if (player && player.stopVideo) player.stopVideo();
  pending = null;
  $("player-view").classList.remove("on");
  document.body.style.overflow = "";
  popOverlay(fromBack);
}
$("close-player").onclick = () => closePlayer(false);
window.addEventListener("popstate", () => {
  if ($("player-view").classList.contains("on")) closePlayer(true);
});

/* ================= load ================= */
async function load(force){
  try { cfg = await loadConfig(); }
  catch(e){ fatal(e.message); return; }

  const cached = JSON.parse(store.get("shelf.feed") || "null");
  const fresh = cached && (Date.now() - cached.ts < 30*60*1000);
  if (cached && !force){
    videos = cached.videos; renderRail(); renderFeed();
    subEl.textContent = cfg.channels.length + " channels · updated " + ago(new Date(cached.ts).toISOString());
    if (fresh) return;
  } else { renderRail(); skeleton(); subEl.textContent = "Checking for new videos"; }

  $("refresh").firstElementChild.classList.add("spin");
  try {
    videos = await fetchFeed();
    store.set("shelf.feed", JSON.stringify({ts:Date.now(), videos}));
    renderFeed();
    subEl.textContent = cfg.channels.length + " channels · updated just now";
  } catch(e){
    subEl.textContent = "Couldn't refresh";
    if (!videos.length) fatal(e.message);
  }
  $("refresh").firstElementChild.classList.remove("spin");
}
$("refresh").onclick = () => load(true);
load(false);

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
