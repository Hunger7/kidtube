<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KidTube - Monty Cross</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1113">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= themes ================= */
:root{
  --ground:#0F1113; --raised:#191B1E; --hairline:#2A2D31;
  --paper:#F2F3F4; --muted:#8A9099;
  --accent:#29B8D0; --accent-ink:#062028;
  --on:#A8DB2F; --warn:#E8703A;
  --scrim:rgba(8,10,12,.62);
}
:root[data-theme="black"]{
  --ground:#000000; --raised:#0D0D0D; --hairline:#242424;
  --paper:#F5F5F5; --muted:#8C8C8C;
  --accent:#F5F5F5; --accent-ink:#000000;
  --on:#F5F5F5; --warn:#D96A4A;
  --scrim:rgba(0,0,0,.66);
}
:root[data-theme="white"]{
  --ground:#FFFFFF; --raised:#F1F0ED; --hairline:#DBD9D4;
  --paper:#16181B; --muted:#5F656D;
  --accent:#16181B; --accent-ink:#FFFFFF;
  --on:#0F7B6C; --warn:#B4442A;
  --scrim:rgba(255,255,255,.72);
}
/* follow the device */
:root[data-theme="device"]{
  --ground:#FFFFFF; --raised:#F1F0ED; --hairline:#DBD9D4;
  --paper:#16181B; --muted:#5F656D;
  --accent:#16181B; --accent-ink:#FFFFFF;
  --on:#0F7B6C; --warn:#B4442A;
  --scrim:rgba(255,255,255,.72);
}
@media (prefers-color-scheme:dark){
  :root[data-theme="device"]{
    --ground:#000000; --raised:#0D0D0D; --hairline:#242424;
    --paper:#F5F5F5; --muted:#8C8C8C;
    --accent:#F5F5F5; --accent-ink:#000000;
    --on:#F5F5F5; --warn:#D96A4A;
    --scrim:rgba(0,0,0,.66);
  }
}

/* ================= base ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--paper)}
body{
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header{position:sticky;top:0;z-index:20;background:var(--ground);padding:18px 18px 0}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(19px,5.4vw,27px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hbtns{display:flex;gap:2px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--raised)}
.iconbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 18px;margin:0 -18px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;
  border-radius:999px;background:var(--raised);border:1px solid var(--hairline);
  font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip.text-only{padding:7px 16px}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

main{padding:0 18px 40px}
.card{display:block;width:100%;text-align:left;padding:0;margin:0 0 26px}
.thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--raised)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(8,10,12,.85);color:#F2F3F4;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:5px}
.card h2{margin:11px 0 3px;font-size:16px;font-weight:600;line-height:1.32;letter-spacing:-.01em}
.meta{margin:0;font-size:13px;color:var(--muted)}
@media (min-width:760px){
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 20px;max-width:1240px;margin:0 auto}
  header{max-width:1240px;margin:0 auto}
}

/* ================= player ================= */
/* --chrome is the vertical space reserved for title + controls; the video is
   sized to whatever is left, so the controls can never be pushed offscreen. */
#player-view{
  --chrome:340px;
  position:fixed;inset:0;z-index:60;background:var(--ground);
  display:none;flex-direction:column;height:100dvh;
}
#player-view.on{display:flex}
.stage{flex:0 0 auto;display:grid;place-items:center;background:#000;width:100%}
.frame{
  position:relative;aspect-ratio:16/9;
  width:min(100%, max(240px, calc((100dvh - var(--chrome)) * 16 / 9)));
}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
/* Every tap lands here, never on YouTube's own UI. */
#shield{position:absolute;inset:0;z-index:2;background:transparent}
#tapcue{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .18s}
#tapcue.show{opacity:1}
#tapcue div{width:74px;height:74px;border-radius:50%;background:rgba(8,10,12,.6);display:grid;place-items:center}
#tapcue svg{width:32px;height:32px;fill:#F2F3F4}

.nowplaying{flex:0 0 auto;padding:14px 18px 4px;overflow:hidden}
.nowplaying h2{margin:0 0 3px;font-size:17px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.controls{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px;
  padding:8px 18px calc(12px + env(safe-area-inset-bottom));
}
.seekrow{flex:0 0 auto;display:flex;align-items:center;gap:11px}
.t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:42px}
.t.right{text-align:right}
input[type=range]{flex:1 1 auto;min-width:0;-webkit-appearance:none;appearance:none;height:28px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--hairline)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--accent);margin-top:-7px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--hairline)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border:0;border-radius:50%;background:var(--accent)}

.btnrow{display:flex;align-items:stretch;gap:10px}
.btnrow.primary{flex:1 1 auto;min-height:76px;max-height:30vh}
.btnrow.secondary{flex:0 0 auto;height:clamp(58px,11vh,104px)}
.pbtn{flex:1 1 auto;border-radius:12px;background:var(--raised);border:1px solid var(--hairline);
  display:grid;place-items:center;gap:3px;padding:6px}
.pbtn:active{background:var(--hairline)}
.pbtn[disabled]{opacity:.35}
.pbtn.main{flex:1.5 1 auto;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pbtn svg{width:min(34px,7vw);height:min(34px,7vw);min-width:24px;min-height:24px;fill:currentColor}
.btnrow.primary .pbtn svg{width:clamp(26px,9vw,42px);height:clamp(26px,9vw,42px)}
.pbtn .lab{font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--muted)}
.pbtn.main .lab{color:var(--accent-ink)}
.pbtn[aria-pressed="true"]{border-color:var(--on);color:var(--on)}
.pbtn[aria-pressed="true"] .lab{color:var(--on)}
.pbtn.wordy{font-size:15px;font-weight:600}
.pbtn.val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

/* landscape / short viewport: video fills, controls float over it */
@media (orientation:landscape) and (max-height:560px) and (pointer:coarse){
  #player-view{--chrome:0px}
  .stage{flex:1 1 auto;min-height:0;height:100%}
  .frame{width:min(100%, calc(100dvh * 16 / 9));max-height:100dvh}
  .nowplaying{display:none}
  .controls{
    position:absolute;left:0;right:0;bottom:0;z-index:4;flex:0 0 auto;
    background:linear-gradient(to top, var(--scrim), transparent);
    padding:26px 20px calc(12px + env(safe-area-inset-bottom));
    gap:8px;transition:opacity .2s;
  }
  .controls.hidden{opacity:0;pointer-events:none}
  .btnrow.primary{min-height:52px;max-height:56px}
  .btnrow.secondary{height:46px}
  .btnrow.primary .pbtn svg{width:24px;height:24px}
  .pbtn{background:var(--scrim);border-color:transparent}
  .t{color:var(--paper)}
}

/* ================= theme sheet ================= */
#sheet{position:fixed;inset:0;z-index:80;display:none;background:rgba(8,10,12,.55)}
#sheet.on{display:block}
.sheet-in{
  position:absolute;left:0;right:0;bottom:0;background:var(--ground);
  border-top:1px solid var(--hairline);border-radius:16px 16px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
}
.sheet-in h2{margin:0 0 4px;font-size:19px;font-weight:600}
.sheet-in p{margin:0 0 16px;font-size:13px;color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tbtn{display:flex;align-items:center;gap:11px;padding:13px;border-radius:12px;
  background:var(--raised);border:1px solid var(--hairline);font-size:15px;font-weight:500;text-align:left}
.tbtn[aria-pressed="true"]{border-color:var(--accent)}
.sw{width:26px;height:26px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(128,128,128,.35)}

/* ================= states ================= */
.state{padding:70px 4px;text-align:center;color:var(--muted);grid-column:1/-1}
.state h2{color:var(--paper);font-size:19px;margin:0 0 8px;font-weight:600}
.state p{margin:0 auto;font-size:14px;max-width:36ch}
.skel{background:var(--raised);border-radius:10px;margin-bottom:26px}
.skel.th{aspect-ratio:16/9}
.skel.l{height:15px;width:82%;margin:11px 0 7px}
.skel.s{height:12px;width:45%}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div><h1 id="app-name">KidTube - Monty Cross</h1><p class="sub" id="sub">Loading</p></div>
    <div class="hbtns">
      <button class="iconbtn" id="theme-btn" aria-label="Appearance">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18"/><path d="M12 3v18"/></svg>
      </button>
      <button class="iconbtn" id="refresh" aria-label="Refresh videos">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.6 3M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>
  <div class="rail" id="rail"></div>
</header>

<main id="feed"></main>

<div id="player-view">
  <div class="stage">
    <div class="frame">
      <div id="yt"></div>
      <div id="shield" role="button" aria-label="Pause or resume"></div>
      <div id="tapcue"><div id="tapcue-inner"></div></div>
    </div>
  </div>
  <div class="nowplaying"><h2 id="np-title"></h2><p class="meta" id="np-meta"></p></div>
  <div class="controls" id="controls">
    <div class="seekrow">
      <span class="t" id="t-now">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position in video">
      <span class="t right" id="t-dur">0:00</span>
    </div>
    <div class="btnrow primary">
      <button class="pbtn" id="back10" aria-label="Back 10 seconds">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg>
      </button>
      <button class="pbtn main" id="playpause" aria-label="Pause">
        <svg viewBox="0 0 24 24" id="pp-icon"><path d="M7 4h4v16H7zm6 0h4v16h-4z"/></svg>
      </button>
      <button class="pbtn" id="fwd10" aria-label="Forward 10 seconds">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg>
      </button>
    </div>
    <div class="btnrow secondary">
      <button class="pbtn val" id="speed" aria-label="Playback speed">1&times;</button>
      <button class="pbtn" id="cc" aria-pressed="false" aria-label="Captions"><span class="lab" id="cc-lab">CC</span></button>
      <button class="pbtn" id="sleep" aria-label="Sleep timer"><span class="lab" id="sleep-lab">Sleep</span></button>
      <button class="pbtn wordy" id="close-player">Done</button>
    </div>
  </div>
</div>

<div id="sheet">
  <div class="sheet-in">
    <h2>Appearance</h2>
    <p>Applies to this device only.</p>
    <div class="themes" id="themes"></div>
  </div>
</div>

<script>
/* ================= config ================= */
/* Override per instance with "appName" in config.json. */
const APP_NAME = "KidTube - Monty Cross";
let cfg = null;
async function loadConfig(){
  const r = await fetch("config.json?v=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("config.json is missing or unreadable (" + r.status + ")");
  const c = await r.json();
  if (!c.apiKey || c.apiKey === "PASTE_YOUR_KEY_HERE") throw new Error("config.json has no API key yet.");
  if (!Array.isArray(c.channels) || !c.channels.length) throw new Error("config.json has no channels yet.");
  return Object.assign({hideShorts:true, maxPerChannel:12, shortsMaxSeconds:180, theme:"midnight", appName:APP_NAME, playerHost:"nocookie"}, c);
}
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }
};
let videos = [], filter = "all";
const $ = id => document.getElementById(id);

/* ================= theme ================= */
const THEMES = [
  {id:"midnight", label:"Midnight", sw:"#29B8D0"},
  {id:"black",    label:"Black",    sw:"#000000"},
  {id:"white",    label:"White",    sw:"#FFFFFF"},
  {id:"device",   label:"Device",   sw:"linear-gradient(90deg,#FFF 50%,#000 50%)"}
];
function applyTheme(id){
  document.documentElement.setAttribute("data-theme", id);
  const g = getComputedStyle(document.documentElement).getPropertyValue("--ground").trim();
  const m = document.querySelector('meta[name="theme-color"]');
  if (m && g) m.setAttribute("content", g);
  renderThemes();
}
function renderThemes(){
  const cur = document.documentElement.getAttribute("data-theme");
  $("themes").innerHTML = THEMES.map(t =>
    `<button class="tbtn" data-t="${t.id}" aria-pressed="${t.id===cur}">
       <span class="sw" style="background:${t.sw}"></span>${t.label}</button>`).join("");
  $("themes").querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    store.set("shelf.theme", b.dataset.t);
    applyTheme(b.dataset.t);
    closeSheet(false);
  });
}
applyTheme(store.get("shelf.theme") || "midnight");

/* ================= api ================= */
const API = "https://www.googleapis.com/youtube/v3/";
async function yt(path, params){
  const q = new URLSearchParams(Object.assign({key:cfg.apiKey}, params));
  const r = await fetch(API + path + "?" + q);
  const j = await r.json();
  if (!r.ok) throw new Error(j?.error?.message || "Request failed (" + r.status + ")");
  return j;
}
async function fetchFeed(){
  const per = Math.max(1, Math.min(30, cfg.maxPerChannel));
  const batches = await Promise.all(cfg.channels.map(async ch => {
    try {
      const r = await yt("playlistItems", {part:"snippet,contentDetails", playlistId:ch.uploads, maxResults:per});
      return (r.items||[]).map(it => ({
        vid: it.contentDetails.videoId, title: it.snippet.title,
        channelId: ch.id, channelTitle: ch.title,
        published: it.contentDetails.videoPublishedAt || it.snippet.publishedAt,
        thumb: (it.snippet.thumbnails.medium || it.snippet.thumbnails.default || {}).url || "",
        seconds: null, aspect: null
      }));
    } catch(e){ return []; }
  }));
  let all = batches.flat().filter(v => v.vid);
  all.sort((a,b) => new Date(b.published) - new Date(a.published));
  all = all.slice(0, 90);
  await addDetails(all);
  if (cfg.hideShorts) all = all.filter(v => !isShortVideo(v));
  return all;
}

/* A Short is a vertical (or square) video up to the Shorts ceiling — duration
   alone stopped being a reliable signal when the limit rose to 3 minutes.
   If the aspect ratio can't be determined, fall back to duration plus a
   #shorts tag in the title, which most Shorts carry. */
function isShortVideo(v){
  const ceiling = cfg.shortsMaxSeconds;
  if (v.seconds != null && v.seconds > ceiling) return false;
  if (v.aspect != null) return v.aspect < 1.05;
  if (v.seconds != null && v.seconds <= ceiling && /#short/i.test(v.title)) return true;
  return v.seconds != null && v.seconds <= 65;
}
async function addDetails(list){
  for (let i = 0; i < list.length; i += 50){
    const slice = list.slice(i, i+50);
    try {
      // maxWidth makes the API size the embed to the video's real aspect ratio,
      // which is the only place the API exposes portrait vs landscape.
      const r = await yt("videos", {
        part:"contentDetails,player", maxWidth:480,
        id:slice.map(v=>v.vid).join(",")
      });
      const map = {};
      (r.items||[]).forEach(it => map[it.id] = {
        seconds: iso8601(it.contentDetails.duration),
        aspect: embedAspect(it.player && it.player.embedHtml)
      });
      slice.forEach(v => {
        const d = map[v.vid];
        if (!d) return;
        if (d.seconds != null) v.seconds = d.seconds;
        if (d.aspect != null) v.aspect = d.aspect;
      });
    } catch(e){}
  }
}
function embedAspect(html){
  if (!html) return null;
  const w = /width="(\d+)"/.exec(html), h = /height="(\d+)"/.exec(html);
  if (!w || !h || !+h[1]) return null;
  return +w[1] / +h[1];
}
function iso8601(d){
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d || "");
  return m ? (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0) : null;
}

/* ================= formatting ================= */
function clock(s){
  if (s == null || isNaN(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
           : `${m}:${String(sec).padStart(2,"0")}`;
}
function ago(iso){
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 3600) return Math.max(1, Math.floor(d/60)) + " min ago";
  if (d < 86400) return Math.floor(d/3600) + " hr ago";
  if (d < 2592000){ const n = Math.floor(d/86400); return n + (n===1?" day ago":" days ago"); }
  if (d < 31536000){ const n = Math.floor(d/2592000); return n + (n===1?" month ago":" months ago"); }
  const n = Math.floor(d/31536000); return n + (n===1?" year ago":" years ago");
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const feedEl = $("feed"), railEl = $("rail"), subEl = $("sub");

/* ================= render ================= */
function renderRail(){
  if (!cfg || !cfg.channels.length){ railEl.innerHTML = ""; return; }
  const chip = (id,label,thumb) =>
    `<button class="chip${thumb?"":" text-only"}" data-ch="${esc(id)}" aria-pressed="${filter===id}">` +
    (thumb ? `<img src="${esc(thumb)}" alt="">` : "") + esc(label) + `</button>`;
  railEl.innerHTML = chip("all","Everything","") + cfg.channels.map(c => chip(c.id,c.title,c.thumb)).join("");
  railEl.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => {
    filter = b.dataset.ch; renderRail(); renderFeed();
  });
}
function renderFeed(){
  const list = filter === "all" ? videos : videos.filter(v => v.channelId === filter);
  if (!list.length){
    feedEl.innerHTML = `<div class="state"><h2>No videos here</h2>
      <p>Nothing recent from this channel, or the list hasn't refreshed yet.</p></div>`;
    return;
  }
  feedEl.innerHTML = list.map((v,i) => `
    <button class="card" data-i="${i}">
      <div class="thumb"><img src="${esc(v.thumb)}" alt="" loading="lazy">
        ${v.seconds ? `<span class="dur">${clock(v.seconds)}</span>` : ""}</div>
      <h2>${esc(v.title)}</h2>
      <p class="meta">${esc(v.channelTitle)} · ${ago(v.published)}</p>
    </button>`).join("");
  feedEl.querySelectorAll(".card").forEach(b => b.onclick = () => play(list[+b.dataset.i]));
}
function skeleton(){
  feedEl.innerHTML = Array(4).fill(`<div><div class="skel th"></div><div class="skel l"></div><div class="skel s"></div></div>`).join("");
}
function fatal(msg){
  feedEl.innerHTML = `<div class="state"><h2>Can't load the shelf</h2><p>${esc(msg)}</p></div>`;
  subEl.textContent = "Not ready";
}

/* ================= overlays / back stack ================= */
function pushOverlay(){ if (!(history.state && history.state.overlay)) history.pushState({overlay:true}, ""); }
function popOverlay(fromBack){ if (!fromBack && history.state && history.state.overlay) history.back(); }

function openSheet(){ $("sheet").classList.add("on"); pushOverlay(); }
function closeSheet(fromBack){ $("sheet").classList.remove("on"); popOverlay(fromBack); }
$("theme-btn").onclick = openSheet;
$("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(false); };

/* ================= player ================= */
let player = null, apiReady = false, pending = null, ticker = null, dragging = false;
let ccOn = store.get("shelf.cc") === "1";
let rates = [0.75, 1, 1.25, 1.5, 2], rate = 1;
let sleepMin = 0, sleepAt = 0, sleepTimer = null;
const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<path d="M7 4h4v16H7zm6 0h4v16h-4z"/>';
const isShort = () => window.matchMedia("(orientation:landscape) and (max-height:560px) and (pointer:coarse)").matches;

window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending){ const v = pending; pending = null; play(v); } };
(function(){ const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

function play(v){
  $("np-title").textContent = v.title;
  $("np-meta").textContent = v.channelTitle + " · " + ago(v.published);
  $("t-now").textContent = "0:00";
  $("t-dur").textContent = clock(v.seconds);
  $("seek").value = 0;
  $("player-view").classList.add("on");
  document.body.style.overflow = "hidden";
  pushOverlay();
  showControls();
  if (!apiReady){ pending = v; return; }
  if (player && player.loadVideoById) player.loadVideoById(v.vid);
  else player = new YT.Player("yt", {
    videoId: v.vid,
    // "nocookie" serves embeds only, so it can be allowed in Family Link without
    // opening browsable YouTube. It also sends no session cookie, so a Premium
    // subscription does not apply and ads play. "youtube" is the reverse trade.
    host: cfg.playerHost === "youtube"
      ? "https://www.youtube.com"
      : "https://www.youtube-nocookie.com",
    playerVars: {
      controls:0, disablekb:1, fs:0, rel:0, iv_load_policy:3,
      modestbranding:1, playsinline:1, autoplay:1,
      cc_load_policy: ccOn ? 1 : 0
    },
    events: {
      onReady: () => { initRates(); applyCC(); startTicker(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) closePlayer(false);
        setPP(e.data === YT.PlayerState.PLAYING);
        if (e.data === YT.PlayerState.PLAYING){ startTicker(); refreshCCAvailability(); }
      }
    }
  });
  startTicker();
}

function setPP(playing){
  $("pp-icon").innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
  $("playpause").setAttribute("aria-label", playing ? "Pause" : "Play");
}
function startTicker(){
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!player || !player.getDuration || dragging) return;
    const d = player.getDuration(), t = player.getCurrentTime();
    if (d){
      $("t-dur").textContent = clock(d);
      $("t-now").textContent = clock(t);
      $("seek").value = Math.round(t / d * 1000);
    }
    if (sleepMin) updateSleepLabel();
  }, 500);
}
function toggle(){
  if (!player || !player.getPlayerState) return;
  const playing = player.getPlayerState() === YT.PlayerState.PLAYING;
  if (playing) player.pauseVideo(); else player.playVideo();
  cue(playing ? PAUSE_ICON : PLAY_ICON);
}
function cue(icon){
  $("tapcue-inner").innerHTML = `<svg viewBox="0 0 24 24">${icon}</svg>`;
  const c = $("tapcue");
  c.classList.add("show");
  clearTimeout(cue._t);
  cue._t = setTimeout(() => c.classList.remove("show"), 420);
}

/* auto-hiding controls, landscape only */
let hideTimer = null;
function showControls(){
  $("controls").classList.remove("hidden");
  clearTimeout(hideTimer);
  if (isShort()) hideTimer = setTimeout(() => $("controls").classList.add("hidden"), 3500);
}
$("shield").onclick = () => {
  if (isShort() && $("controls").classList.contains("hidden")){ showControls(); return; }
  toggle(); showControls();
};
$("controls").addEventListener("pointerdown", showControls);

/* transport */
$("playpause").onclick = () => { toggle(); showControls(); };
$("back10").onclick = () => { if (player) player.seekTo(Math.max(0, player.getCurrentTime() - 10), true); showControls(); };
$("fwd10").onclick = () => { if (player) player.seekTo(player.getCurrentTime() + 10, true); showControls(); };

const seek = $("seek");
["pointerdown","touchstart"].forEach(ev => seek.addEventListener(ev, () => dragging = true));
seek.addEventListener("input", () => {
  if (!player || !player.getDuration) return;
  $("t-now").textContent = clock(seek.value / 1000 * player.getDuration());
});
["pointerup","touchend","change"].forEach(ev => seek.addEventListener(ev, () => {
  if (player && player.getDuration) player.seekTo(seek.value / 1000 * player.getDuration(), true);
  dragging = false;
}));

/* speed */
function initRates(){
  try {
    const r = player.getAvailablePlaybackRates();
    if (Array.isArray(r) && r.length) rates = r;
  } catch(e){}
  rate = 1;
  $("speed").innerHTML = "1&times;";
}
$("speed").onclick = () => {
  const i = rates.indexOf(rate);
  rate = rates[(i + 1) % rates.length];
  try { player.setPlaybackRate(rate); } catch(e){}
  $("speed").innerHTML = (Number.isInteger(rate) ? rate : rate) + "&times;";
  showControls();
};

/* captions — the module name differs between player versions, so try both */
function applyCC(){
  const mods = ["captions","cc"];
  try {
    if (ccOn){
      mods.forEach(m => { try { player.loadModule(m); } catch(e){} });
      mods.forEach(m => { try { player.setOption(m, "track", {languageCode:"en"}); } catch(e){} });
    } else {
      mods.forEach(m => { try { player.setOption(m, "track", {}); } catch(e){} });
      mods.forEach(m => { try { player.unloadModule(m); } catch(e){} });
    }
  } catch(e){}
  $("cc").setAttribute("aria-pressed", String(ccOn));
}
function refreshCCAvailability(){
  let has = true;
  try {
    const list = player.getOption("captions", "tracklist");
    if (Array.isArray(list)) has = list.length > 0;
  } catch(e){}
  $("cc").disabled = !has;
  $("cc-lab").textContent = has ? "CC" : "No CC";
}
$("cc").onclick = () => {
  ccOn = !ccOn;
  store.set("shelf.cc", ccOn ? "1" : "0");
  applyCC(); showControls();
};

/* sleep timer */
const SLEEPS = [0, 15, 30, 45, 60];
$("sleep").onclick = () => {
  sleepMin = SLEEPS[(SLEEPS.indexOf(sleepMin) + 1) % SLEEPS.length];
  clearTimeout(sleepTimer);
  if (sleepMin){
    sleepAt = Date.now() + sleepMin * 60000;
    sleepTimer = setTimeout(() => {
      try { player.pauseVideo(); } catch(e){}
      sleepMin = 0; updateSleepLabel();
    }, sleepMin * 60000);
  }
  updateSleepLabel(); showControls();
};
function updateSleepLabel(){
  if (!sleepMin){ $("sleep-lab").textContent = "Sleep"; $("sleep").setAttribute("aria-pressed","false"); return; }
  const left = Math.max(0, Math.ceil((sleepAt - Date.now()) / 60000));
  $("sleep-lab").textContent = left + "m";
  $("sleep").setAttribute("aria-pressed","true");
}

function closePlayer(fromBack){
  clearInterval(ticker); clearTimeout(hideTimer); clearTimeout(sleepTimer);
  sleepMin = 0; updateSleepLabel();
  if (player && player.stopVideo) player.stopVideo();
  pending = null;
  $("player-view").classList.remove("on");
  document.body.style.overflow = "";
  popOverlay(fromBack);
}
$("close-player").onclick = () => closePlayer(false);
window.addEventListener("popstate", () => {
  if ($("player-view").classList.contains("on")) closePlayer(true);
  else if ($("sheet").classList.contains("on")) closeSheet(true);
});
window.addEventListener("orientationchange", showControls);

/* keyboard, for the desktop case */
window.addEventListener("keydown", e => {
  if (!$("player-view").classList.contains("on")) return;
  if (e.key === " " || e.key === "k"){ e.preventDefault(); toggle(); showControls(); }
  else if (e.key === "ArrowLeft"){ $("back10").click(); }
  else if (e.key === "ArrowRight"){ $("fwd10").click(); }
  else if (e.key === "Escape"){ closePlayer(false); }
});

/* ================= load ================= */
async function load(force){
  try { cfg = await loadConfig(); }
  catch(e){ fatal(e.message); return; }
  if (!store.get("shelf.theme") && cfg.theme) applyTheme(cfg.theme);
  if (cfg.appName && cfg.appName !== APP_NAME){
    $("app-name").textContent = cfg.appName;
    document.title = cfg.appName;
  }

  const cached = JSON.parse(store.get("shelf.feed") || "null");
  const fresh = cached && (Date.now() - cached.ts < 30*60*1000);
  if (cached && !force){
    videos = cached.videos; renderRail(); renderFeed();
    subEl.textContent = cfg.channels.length + " channels · updated " + ago(new Date(cached.ts).toISOString());
    if (fresh) return;
  } else { renderRail(); skeleton(); subEl.textContent = "Checking for new videos"; }

  $("refresh").firstElementChild.classList.add("spin");
  try {
    videos = await fetchFeed();
    store.set("shelf.feed", JSON.stringify({ts:Date.now(), videos}));
    renderFeed();
    subEl.textContent = cfg.channels.length + " channels · updated just now";
  } catch(e){
    subEl.textContent = "Couldn't refresh";
    if (!videos.length) fatal(e.message);
  }
  $("refresh").firstElementChild.classList.remove("spin");
}
$("refresh").onclick = () => load(true);
load(false);

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
